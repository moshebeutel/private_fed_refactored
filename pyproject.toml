[tool.poetry]
name = "private-federated-polyagamma"
version = "0.1.0"
description = "Implementation of differentially private federated learning"
authors = ["Moshe Beutel <moshebeutel@gmail.com>"]
readme = "README.md"
packages = [{include = "private_federated"}]

[tool.poetry.dependencies]
python = "3.8.1"
#tqdm = "^4.66.1"
#wandb = "^0.17.0"
#dp-accounting = "^0.4.3"
#typing-extensions = "^4.8.0"
#pillow = "^10.1.0"
#scikit-learn = "^1.4.1.post1"
#cython = "^3.0.9"
#scipy = "^1.12.0"
#gitpython = "^3.1.42"
#jupyter = "^1.0.0"
#torch = "^2.3.0"
#torchvision = "^0.18.0"
#gpytorch = "^1.11"
pypolyagamma = "^1.2.3"
gpytorch = "^1.11"
wandb = "^0.17.3"
tqdm = "^4.66.4"
torchvision = "^0.18.1"

[tool.poetry.scripts]
sweep = "app.federated_learning_sweep:run_sweep"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
